name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    container: debian:testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            debhelper-compat \
            dpkg-dev \
            libssl-dev \
            libuv1-dev \
            pkg-config \
            zlib1g-dev \
            lintian \
            autopkgtest \
            autodep8
      
      - name: Create upstream tarball
        run: |
          VERSION=$(head -1 debian/changelog | sed 's/.*(\([^)]*\)).*/\1/' | cut -d- -f1)
          cd ..
          tar --exclude='.git' --exclude='.github' -czf libusockets_${VERSION}.orig.tar.gz --transform "s,^uSockets-deb,libusockets-${VERSION}," uSockets-deb
      
      - name: Build source and binary packages
        run: |
          rm -rf .github
          dpkg-buildpackage -us -uc
      
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          mv ../*.deb ../*.dsc ../*.tar.* ../*.changes ../*.buildinfo artifacts/
      
      - name: Run lintian
        run: lintian -i artifacts/*.changes
        continue-on-error: true
      
      - name: Run autopkgtest
        run: |
          cd artifacts
          autopkgtest *.dsc -- null
        continue-on-error: true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-amd64
          path: artifacts/*

  build-arm64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64
      
      - name: Build in Debian arm64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            debian:testing bash -c '
              apt-get update
              apt-get install -y \
                build-essential \
                debhelper-compat \
                dpkg-dev \
                libssl-dev \
                libuv1-dev \
                pkg-config \
                zlib1g-dev
              
              VERSION=$(head -1 debian/changelog | sed "s/.*(\([^)]*\)).*/\1/" | cut -d- -f1)
              cd ..
              tar --exclude=".git" --exclude=".github" -czf libusockets_${VERSION}.orig.tar.gz --transform "s,^work,libusockets-${VERSION}," work
              cd work
              rm -rf .github
              dpkg-buildpackage -b -us -uc
              
              mkdir -p artifacts
              mv ../*.deb artifacts/
              mv ../*.changes ../*.buildinfo artifacts/ 2>/dev/null || true
            '
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-arm64
          path: artifacts/*

  build-armhf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7
      
      - name: Build in Debian armhf container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/work \
            -w /work \
            debian:testing bash -c '
              apt-get update
              apt-get install -y \
                build-essential \
                debhelper-compat \
                dpkg-dev \
                libssl-dev \
                libuv1-dev \
                pkg-config \
                zlib1g-dev
              
              VERSION=$(head -1 debian/changelog | sed "s/.*(\([^)]*\)).*/\1/" | cut -d- -f1)
              cd ..
              tar --exclude=".git" --exclude=".github" -czf libusockets_${VERSION}.orig.tar.gz --transform "s,^work,libusockets-${VERSION}," work
              cd work
              rm -rf .github
              dpkg-buildpackage -b -us -uc
              
              mkdir -p artifacts
              mv ../*.deb artifacts/
              mv ../*.changes ../*.buildinfo artifacts/ 2>/dev/null || true
            '
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-armhf
          path: artifacts/*

  create-release:
    needs: [build-amd64, build-arm64, build-armhf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
      
      - name: Prepare release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp -v {} release-files/ \;
          echo "Final release files:"
          ls -lh release-files/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## libusockets ${{ steps.version.outputs.version }}
            
            Debian packages for uSockets library.
            
            ### Artifacts
            - **Source package** (.dsc, .orig.tar.gz) for rebuilding
            - **Binary packages** for amd64, arm64, armhf
            
            ### Installation
            ```bash
            # For amd64
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/libusockets-dev_${{ steps.version.outputs.version }}_amd64.deb
            sudo dpkg -i libusockets-dev_${{ steps.version.outputs.version }}_amd64.deb
            
            # For arm64
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/libusockets-dev_${{ steps.version.outputs.version }}_arm64.deb
            sudo dpkg -i libusockets-dev_${{ steps.version.outputs.version }}_arm64.deb
            
            # For armhf
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/libusockets-dev_${{ steps.version.outputs.version }}_armhf.deb
            sudo dpkg -i libusockets-dev_${{ steps.version.outputs.version }}_armhf.deb
            ```
          files: release-files/*
          draft: false
          prerelease: false
